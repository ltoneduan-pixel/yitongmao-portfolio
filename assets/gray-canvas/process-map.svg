      <text x="22" y="48" fill="#286d83" font-size="18" letter-spacing="2">02</text>
      <text x="22" y="108" fill="#24272b" font-size="26" font-weight="600">Participant</text>
      <text x="22" y="143" fill="#24272b" font-size="26" font-weight="600">interviews</text>
      <path d="M22 180h174" stroke="#d9e2e7" stroke-width="2"/>
